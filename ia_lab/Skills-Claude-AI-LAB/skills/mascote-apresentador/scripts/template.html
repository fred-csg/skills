<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mascote Apresentador</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@font-face { font-family: 'Poppins'; font-weight: 500; src: url(fonts/Poppins-Medium.ttf); font-display: block; }
@font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/Poppins-SemiBold.ttf); font-display: block; }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); font-display: block; }
@font-face { font-family: 'Poppins'; font-weight: 900; src: url(fonts/Poppins-Black.ttf); font-display: block; }
:root { --bg0: #050913; --bg1: #10203F; --ac: #FFB23F; --ap: #5AA9FF;
  --w: #F2F3F6; --g1: #B9BEC8; --g2: #8A909B; --g3: #4B505B; --line: rgba(255,255,255,.08); }
html, body { margin: 0; background: #000; }
body { width: 1080px; height: 1920px; overflow: hidden; position: relative; font-family: 'Poppins', sans-serif; color: var(--w); }
#bg { position: absolute; inset: 0; background: radial-gradient(115% 65% at 30% 0%, var(--bg1) 0%, var(--bg0) 62%), var(--bg0); }
#spot, #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#tex { position: absolute; inset: 0; opacity: .055; background-image: radial-gradient(circle, #fff 1.1px, transparent 1.6px); background-size: 36px 36px; }
#vig { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }
#grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: .07; mix-blend-mode: screen; pointer-events: none; }
#stage { position: absolute; inset: 0; transform-origin: 510px 1000px; }
.abs { position: absolute; }
.sc { position: absolute; inset: 0; display: none; }
.mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--g2); }
.card { position: absolute; border-radius: 30px; background: linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.018)), var(--bg0);
  border: 1.5px solid var(--line); box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07); }
.hd { font-weight: 900; letter-spacing: -.045em; line-height: .95; }
.chip { position: absolute; left: 0; top: 0; width: 112px; height: 112px; border-radius: 30px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03)), var(--bg0);
  border: 1.5px solid rgba(255,255,255,.14); box-shadow: 0 20px 40px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
#cap { position: absolute; left: 510px; top: 1405px; transform: translate(-50%, -50%); white-space: nowrap; font: 600 56px 'Poppins'; letter-spacing: -.01em; text-align: center; }
#cap .wd { display: inline-block; }
#cap .ac { color: var(--ac); }
#cap .tag { display: inline-block; font: 600 22px 'JetBrains Mono'; letter-spacing: .14em; color: var(--g1); border: 1.5px solid rgba(255,255,255,.22);
  border-radius: 99px; padding: 6px 16px; vertical-align: 12px; margin-right: 18px; }
#cap .p { color: var(--g1); }
#hud { position: absolute; inset: 0; pointer-events: none; }
.glass { position: absolute; border-radius: 99px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.13);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 20px 50px rgba(0,0,0,.45); backdrop-filter: blur(12px); }
#mwrap { position: absolute; left: 0; top: 0; width: 800px; height: 800px; }
#masc { width: 800px; height: 800px; overflow: visible; }
</style>
</head>

    <div class="glass abs" id="prog" style="left:230px;top:990px;width:560px;height:96px;border-radius:30px">

    <div class="abs" id="rpl" style="left:240px;top:830px;width:600px;height:96px;border-radius:30px;background:rgba(255,255,255,.07);border:1.5px solid var(--line)">
      <div class="abs" style="left:18px;top:18px;width:60px;height:60px;border-radius:50%;background:var(--ac);font:900 26px Poppins;color:#0A0B0F;text-align:center;line-height:60px;letter-spacing:-.04em">LS</div>
      <div class="abs" style="left:96px;top:12px;font:600 19px 'JetBrains Mono';letter-spacing:.1em;color:var(--g2)">LUCAS · RESPONDEU</div>
      <div class="abs" style="left:96px;top:40px;font:600 32px 'Poppins'">te passei no direct ⚡</div></div>
  </div>

  <div id="mwrap"><svg id="masc" viewBox="-400 -400 800 800"></svg></div>
  <div id="front">
    <div class="abs" id="doc" style="left:0;top:0;width:220px;height:280px;border-radius:22px;background:#F2F3F6;box-shadow:0 30px 60px rgba(0,0,0,.5);display:none;transform-origin:110px 140px">
      <div class="mono abs" style="left:22px;top:22px;font-size:16px;color:#4B505B">ROTEIRO.TXT</div>
      <div class="abs" style="left:22px;top:66px;width:176px;height:12px;border-radius:6px;background:#B9BEC8"></div><div class="abs" style="left:22px;top:94px;width:140px;height:12px;border-radius:6px;background:#B9BEC8"></div>
      <div class="abs" style="left:22px;top:122px;width:160px;height:12px;border-radius:6px;background:#B9BEC8"></div><div class="abs" style="left:22px;top:150px;width:100px;height:12px;border-radius:6px;background:var(--ac)"></div>
      <div class="abs" style="left:22px;top:178px;width:150px;height:12px;border-radius:6px;background:#B9BEC8"></div></div>

</div>

<script src="audio/boca.js"></script>
<script>
// =====================================================================================
// MASCOTE APRESENTADOR — template (é o vídeo de exemplo "GHOST" completo).
// 0) ESTILO ...... mascote / moldura / paleta / layout / nome — PERGUNTAR AO USUÁRIO ANTES (SKILL.md, passo 0)
//    prévia de qualquer combinação: index.html?mascote=astro&hud=anel&paleta=lima
// 1) W ........... tempos da fala (palavras.py + falas.json do dialogo.py)
// 2) CAPS ........ legendas (P = pergunta do apresentador, com etiqueta VOCÊ; 'ac' = palavra-chave)
// 3) MP/FK/HK/GK . mascote: lugar (= layout), cara, mãos, olhar (references/mascote.md)
// 4) cenas ....... HTML de cada .sc + bloco no render(t)      5) CH (capítulos)      6) sfx(...)
// =====================================================================================
const ESTILO = { mascote: 'boo', hud: 'regua', paleta: 'lima', nome: 'GHOST', ep: 'EP01 · GHOST' };
const QS = new URLSearchParams(location.search);
for (const k of ['mascote', 'hud', 'paleta', 'nome', 'ep']) if (QS.get(k)) ESTILO[k] = QS.get(k);

// ---------------- paletas (fundo escuro → grafite, acento, apoio) ----------------
const PALETAS = {
  noite: {b0: '#04060B', b1: '#0F1626', ac: '#FF4F4F', ap: '#3DDC84'},
  marinho: {b0: '#050913', b1: '#10203F', ac: '#FFB23F', ap: '#5AA9FF'},
  lima: {b0: '#08060F', b1: '#1C1336', ac: '#C8FF3D', ap: '#9B7BFF'},
  petroleo: {b0: '#031010', b1: '#0B2A27', ac: '#FF7A59', ap: '#3FE0C5'},
  vinho: {b0: '#100509', b1: '#2B0D18', ac: '#FFD166', ap: '#FF5C8A'},
  ciano: {b0: '#04080A', b1: '#0D1C22', ac: '#2EE6FF', ap: '#FF3D7F'},
};
let PAL = PALETAS[ESTILO.paleta] || PALETAS.lima, PALK = '';
function setPal(k) { if (k === PALK) return; PALK = k; PAL = PALETAS[k]; [['b0', '--bg0'], ['b1', '--bg1'], ['ac', '--ac'], ['ap', '--ap']].forEach(([a, v]) => document.documentElement.style.setProperty(v, PAL[a])); }
setPal(PALETAS[ESTILO.paleta] ? ESTILO.paleta : 'lima');
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const RGBA = (h, a) => `rgba(${rgb(h).join(',')},${a})`;

// ================= motor =================
const OFF = 0.08, T = (x) => x + OFF;
const $ = (s) => document.querySelector(s);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => cl((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const E = { oE: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), oC: (x) => 1 - Math.pow(1 - x, 3), iC: (x) => x * x * x, ioS: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  ioC: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2) };
function spr(tau, f = 2.4, z = 0.55) {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + ((z * w) / wd) * Math.sin(wd * tau));
}
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const show = (id, t, a, b) => { const el = document.getElementById(id); const v = t >= a && t < b; if (el._v !== v) { el.style.display = v ? 'block' : 'none'; el._v = v; } return v; };
function pop(el, t, tin, tout = 1e9, o = {}) {
  const {dy = 60, s0 = 0.78, f = 2.5, z = 0.42, dur = 0.26, rot = 0} = o;   // bounce elástico (z baixo = mais overshoot)
  const k = spr(t - tin, f, z), kb = E.oE(P(t, tin, 0.3)), ko = E.iC(P(t, tout, dur));
  const op = cl((t - tin) * 7) * (1 - ko);
  el.style.opacity = op.toFixed(3); el.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
  el.style.transform = `translateY(${((1 - k) * dy - ko * 30).toFixed(1)}px) scale(${(lerp(s0, 1, k) - ko * 0.06).toFixed(4)}) rotate(${((1 - k) * rot).toFixed(2)}deg)`;
  const b = (1 - kb) * 14 + ko * 12; el.style.filter = b > 0.2 ? `blur(${b.toFixed(1)}px)` : 'none';
  return op;
}
const typeIn = (el, txt, t, a, b) => { const n = Math.round(txt.length * P(t, a, b - a)); if (el._n !== n) { el.textContent = txt.slice(0, n); el._n = n; } return n; };
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ================= fala (audio/locucao.mp3 = dialogo.py) =================
const W = {   // voz do Ghost = Lax Whisper +4,5 semitons (aprovada 23/10)
  ue: 0.18, voce: 0.68, quem: 1.50,
  prazer: 2.29, eu1: 3.02, nome: 3.54, teu: 4.18, parceiro: 4.64, video: 5.26,
  parc2: 6.16, evoce: 7.07, faz: 7.30, que: 7.62,
  eu: 8.33, qualquer: 8.76, parada: 9.12, quer: 9.89, ver: 10.00,
  bora: 10.73, mostra: 11.14, ai: 11.30,
  s1: 12.08, numero: 12.59, vira: 12.94, grafico: 13.22,
  s2: 14.21, qualquer2: 14.62, coisa2: 15.14,
  s3: 16.08, depois: 16.46, dois: 17.14, segundos: 17.34,
  s4: 18.28, passo: 18.38, passo2: 18.80, sem: 19.28, enrolacao: 19.48,
  ta: 20.61, como: 21.06, funciona: 21.54,
  simples: 22.51, voce2: 23.33, manda: 23.64, roteiro: 23.96,
  mostro: 25.06, opcoes: 25.56, personagem: 26.04,
  umas: 27.18, cores: 27.82,
  voce3: 28.63, escolhe: 28.84, resto: 29.72, comigo: 30.02,
  so: 30.69, isso: 30.84,
  so2: 31.65, voce4: 32.47, fala: 32.66, eu5: 33.30, transformo: 33.44, cena: 34.06,
  comenta: 34.87, nome2: 35.14, ai2: 35.44, lucas: 36.08, passa: 36.42, skill: 36.76, fim: 37.09,
};
for (const k in W) W[k] = T(W[k]);
Object.assign(W, {opa: W.ue, oi: W.prazer, sou: W.prazer, mascote: W.teu, apresentador: W.parceiro, eoq: W.parc2, coisa: W.parada, duvida: W.quer,
  habilidades: W.ai, desmonto: W.s2 + 0.1, antes: W.s3, enrolar: W.enrolacao, show: W.cena, manda2: W.passa});
const S2 = W.parc2 - 0.1, S3 = W.eu - 0.1, S4 = W.bora - 0.1, S5 = W.s1 - 0.1, S6 = W.s2 - 0.1, S7 = W.s3 - 0.1, S8 = W.s4 - 0.1, S9 = W.ta - 0.1, SH = W.simples - 0.1, SQ = W.so - 0.1, S15 = W.so2 - 0.1, S11 = W.comenta - 0.1;
const END = W.fim + 1.6;
window.DURATION = END;
const NOME = ESTILO.nome;

// ================= legendas =================
// [inicio, fim, palavras, 'P'?]  — 'P' = fala do apresentador (cinza, com etiqueta VOCÊ)

function burst(t, t0, x, y, n, sc) {

}
